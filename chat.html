<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Client</title>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <style>
        /* Basic styling */
        body {
            display: flex;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        /* Sidebar with user list */
        #userList {
            width: 250px;
            background-color: #f0f0f0;
            border-right: 1px solid #ddd;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #userList ul {
            list-style-type: none;
            padding: 0;
        }

        #userList li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
        }

        #userList li:hover {
            background-color: #eee;
        }

        /* Active user highlight */
        .active-user {
            background-color: #d3f4ff;
            font-weight: bold;
        }

        /* Chat section */
        #chat {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Chat history */
        #chatHistory {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        #chatHistory ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        #chatHistory li {
            margin: 5px 0;
            padding: 10px;
            border-radius: 10px;
            max-width: 60%;
        }

        /* Message from current user */
        .message-sent {
            background-color: #d3f4ff;
            align-self: flex-end;
        }

        /* Message from other user */
        .message-received {
            background-color: #f1f1f1;
            align-self: flex-start;
        }

        /* Message input section */
        #messageInputSection {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #messageInput {
            width: 80%;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ddd;
            font-size: 16px;
        }

        #sendButton {
            padding: 10px 20px;
            background-color: #25d366;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        #sendButton:hover {
            background-color: #128c7e;
        }

        /* Main wrapper to hold the layout */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* Registration form styling */
        #register {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f7f7;
        }

        #register input {
            padding: 10px;
            font-size: 16px;
            margin: 10px;
            width: 250px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        #register button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #register button:hover {
            background-color: #45a049;
        }
        .message-sent {
            background-color: #d3f4ff;
            align-self: flex-end;
            text-align: right;
        }

        .message-received {
            background-color: #f1f1f1;
            align-self: flex-start;
            text-align: left;
        }
        @keyframes blink {
            0% { background-color: #ffeb3b; } /* Yellow highlight */
            50% { background-color: transparent; }
            100% { background-color: #ffeb3b; }
        }

        .blinking {
            animation: blink 1s infinite;
        }

    </style>
</head>
<body>
    <!-- Registration Form -->
    <div id="register">
        <h2>Register</h2>
        <input id="username" placeholder="Enter your username" />
        <button onclick="register()">Register</button>
    </div>

    <div class="container" style="display:none;">
        
        <!-- Left side: User list -->
        <div id="userList">
            <h3>Users</h3>
            <ul id="userListUl"></ul>
        </div>

        <!-- Right side: Chat window -->
        <div id="chat">
            <p id="welcomeText">Select a user to start chatting.</p>
            
            <!-- Chat history -->
            <div id="chatHistory">
                <ul id="chatHistoryList"></ul>
            </div>
        
            <!-- Typing indicator (NEW) -->
            <p id="typingIndicator" style="font-style: italic; color: gray; display: none;"></p>
        
            <!-- Message input -->
            <div id="messageInputSection">
                <input type="text" id="messageInput" placeholder="Enter message" />
                <button id="sendButton" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io('http://localhost:5000');
        let targetUsername = ''; // Variable to store the username of the selected user
        let currentChatHistory = []; // Array to store the chat history for the current conversation
        let loggedInUser = ''; // Store the logged-in user
        let typingTimeout;

        socket.on('connect', () => {
            console.log('Connected to server');
        });
        socket.on('roomJoined', (roomId) => {
             console.log(`Joined room: ${roomId}`);
            socket.emit('getChatHistory'); // Fetch chat history after joining the room
        });
        // Register the user
        function register() {
            const username = document.getElementById('username').value;
            if (username) {
                socket.emit('register', username);
                loggedInUser = username; // Store the logged-in user
                document.getElementById('register').style.display = 'none'; // Hide the register form
                document.querySelector('.container').style.display = 'flex'; // Show the chat interface
            } else {
                alert('Please enter a username');
            }
        }

        // Listen for user list updates
        socket.on('userList', (users) => {
            const userListElement = document.getElementById('userListUl');
            userListElement.innerHTML = ''; // Clear the existing list
            users.forEach(user => {
                const li = document.createElement('li');
                li.textContent = user;
                li.onclick = () => selectUser(user, li); // Add click event to select a user
                userListElement.appendChild(li);
            });
        });

        // Select a user to send a private message to and display chat history
        function selectUser(username, userElement) {
            // Highlight the selected user
            const userListItems = document.querySelectorAll('#userList li');
            userListItems.forEach(item => item.classList.remove('active-user','blinking')); // Remove highlight from all users
            userElement.classList.add('active-user'); // Add highlight to the selected user

            targetUsername = username; // Set the target username
            currentChatHistory = []; // Clear previous chat history
            displayChatHistory(); // Show the chat history of the selected user
            document.getElementById('welcomeText').style.display = 'none'; // Hide welcome text

            socket.emit('startChat', targetUsername); 
            // socket.emit('getChatHistory', targetUsername); // Fetch chat history between the logged-in user and selected user
        }

        // Send message to the selected user
        function sendMessage() {
            const message = document.getElementById('messageInput').value;
            if (message && targetUsername) {
                // Emit the message to the backend
                // socket.emit('sendMessage', message);

                socket.emit('sendMessage', targetUsername, message);

                // Add the sent message to the chat history and display it
                currentChatHistory.push({ from: loggedInUser, message });
                displayChatHistory();
                document.getElementById('messageInput').value = '';
            } else {
                alert('Please select a user and enter a message');
            }
        }

        // Display chat history for the selected user
        function displayChatHistory() {
            console.log("Display chat history called ....");
            
    const chatHistoryList = document.getElementById('chatHistoryList');
    chatHistoryList.innerHTML = ''; // Clear previous history

    currentChatHistory.forEach(msg => {
        const li = document.createElement('li');
        li.textContent = msg.message;
        li.classList.add('chat-message'); // Common class for styling

        if (msg.from === loggedInUser) {
            li.classList.add('message-sent'); // Align to right
            li.style.alignSelf = 'flex-end';
        } else {
            li.classList.add('message-received'); // Align to left
            li.style.alignSelf = 'flex-start';
        }
        chatHistoryList.appendChild(li);
    });

    // Scroll to the bottom of the chat history
    chatHistoryList.scrollTop = chatHistoryList.scrollHeight;
}

        // Receive and display incoming messages
        socket.on('receive-message', (data) => {
            // Only show messages for the currently selected user
            if (data.to === targetUsername || data.from === targetUsername) {
                currentChatHistory.push({ from: data.from, message: data.message });
                displayChatHistory();
            }
                // Add blinking effect to the sender's name in the user list
             const userListItems = document.querySelectorAll('#userList li');
             userListItems.forEach(item => {
                 if (item.textContent === data.from && data.from !== targetUsername) {
                     item.classList.add('blinking');
                 }
             });
        });

        socket.on('chatHistory', (history) => {
           currentChatHistory = history; // Store the history specific to this conversation
            displayChatHistory();
        });

        const messageInput = document.getElementById('messageInput');
        const typingIndicator = document.getElementById('typingIndicator');
        messageInput.addEventListener('input', () => {
    if (targetUsername) {
        socket.emit('typing');
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            socket.emit('stopTyping');
        }, 3000); // Stops typing after 1 second
    }
});

// Listen for "typing" event
socket.on('typing', (user) => {    
    if (user === targetUsername) {
        typingIndicator.textContent = `${user} is typing...`;
        typingIndicator.style.display = 'block';
    }
});

// Listen for "stopTyping" event
socket.on('stopTyping', (user) => {
    if (user === targetUsername) {
        typingIndicator.style.display = 'none';
    }
});

socket.on('userJoined', (message) => {
    alert(message); // Show browser alert
});
    </script>
</body>
