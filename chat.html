<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat</title>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <style>
        /* Basic Styles for layout */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f1f1f1;
            margin: 0;
        }
        #app {
            width: 80%;
            max-width: 900px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Left Section (Group List) */
        #groupListContainer {
            display: flex;
            justify-content: flex-start;
            margin-top: 20px;
        }
        #groupList {
            width: 30%;
            max-width: 250px;
            border-right: 2px solid #ddd;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
        }
        #groupList li {
            padding: 10px;
            cursor: pointer;
            background: #f9f9f9;
            margin-bottom: 10px;
            border-radius: 5px;
            transition: background 0.2s;
        }
        #groupList li:hover {
            background: #e1e1e1;
        }

        /* Right Section (Chat Area) */
        #chatArea {
            width: 65%;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            height: 400px;
        }
        #chatTitle {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            background: #fafafa;
        }
        #msgInput {
            padding: 10px;
            width: calc(100% - 100px);
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        #sendButton {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #sendButton:hover {
            background-color: #45a049;
        }

        /* Register Section */
        #registerSection {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #registerSection input {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 200px;
        }
        #registerSection button {
            padding: 10px;
            background-color: #008CBA;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Create Group Button */
        #createGroupBtn {
            padding: 10px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            margin-bottom: 20px;
            cursor: pointer;
            position: absolute;
            top: 10px;
            left: 10px;
        }
        #createGroupBtn:hover {
            background-color: #1976D2;
        }

    </style>
</head>
<body>

<div id="app">
    <!-- Register Section -->
    <div id="registerSection">
        <h1>Register Username</h1>
        <input type="text" id="username" placeholder="Enter your username" />
        <button id="registerBtn">Register</button>
    </div>

    <!-- Group Chat Section -->
    <div id="chatSection" style="display: none;">
        <!-- Create Group Button on the left top -->
        <button id="createGroupBtn" onclick="createGroup()">Create Group</button>
        <button onclick="sendBroadcastMessage()" >Send Brodcast Message</button>
        <!-- Left Section (Group List) -->
        <div id="groupListContainer">
            <ul id="groupList">
                <div style="display: flex; flex-direction: column; width: 200px;">
                    <div id="joinedGroupsContainer">
                        <h3>Joined Groups</h3>
                        <div id="joinedGroups"></div>
                    </div>
                    
                    <div id="notJoinedGroupsContainer" style="margin-top: 20px;">
                        <h3>Other Groups</h3>
                        <div id="notJoinedGroups"></div>
                    </div>
                </div>
                
                  
                <!-- Groups will be listed here -->
            </ul>
            <!-- Right Section (Chat Area) -->
            <!-- Right Section (Chat Area) -->
            <div id="chatArea">
                <div id="chatTitle"></div> <!-- Displays the name of the current group -->
                <div id="messages" style="height: 400px; overflow-y: auto;"></div> <!-- Chat history (messages) will appear here -->
                <input type="text" id="msgInput" placeholder="Type a message..." /> <!-- Input for new message -->
                <button id="sendButton" onclick="sendMessage()">Send</button> <!-- Button to send the message -->
            </div>

        </div>
    </div>
</div>
<div id="userPopup" style="
    display: none;
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    z-index: 1000;
">
    <h3>Users in Group</h3>
    <ul id="userList"></ul>
    <button onclick="closeUserPopup()">Close</button>
</div>

<script>
    const socket = io('http://localhost:5000'); 
    const usernameInput = document.getElementById("username");
    const registerBtn = document.getElementById("registerBtn");
    const createGroupBtn = document.getElementById("createGroupBtn");
    const joinedListDiv = document.getElementById("joinedGroups");
    const notJoinedListDiv = document.getElementById("notJoinedGroups");
    let currentGroup = null;
    let myUsername = "";    
    
    registerBtn.addEventListener("click", () => {
        const username = usernameInput.value.trim();
        if (username) {
            socket.emit("register", username);
            usernameInput.value = '';
            document.getElementById('registerSection').style.display = 'none'; 
            document.getElementById('chatSection').style.display = 'block'; 
        } else {
            alert("Please enter a username.");
        }
    });
    socket.on("register", (username) => {
     myUsername = username; 
    });
   
    function createGroup() {
        const groupName = prompt("Enter a group name:");
        if (!groupName) return alert("Please enter a group name");
        console.log("Group name pass thayu",groupName)
        socket.emit('createGroup', groupName); // Emit event to create group
        currentGroup = groupName;
    }

    function joinGroup(groupName) {
        console.log("join group called thayu");
        socket.emit('joinGroup', groupName);
        currentGroup = groupName;
        document.getElementById('chatTitle').textContent = 'Group: ' + groupName;
        document.getElementById('messages').innerHTML = ''; 
    }
    socket.on('groupMessage', ({ message, from }) => {
        const messagesDiv = document.getElementById('messages');
        const msgDiv = document.createElement('div');

        if (from === 'System') {
            msgDiv.textContent = `[${from}]: ${message}`;
            msgDiv.style.fontStyle = "italic";
            msgDiv.style.color = "#777"; 
        } else {
            const displayName = from === myUsername ? 'You' : from || 'Anon';
            msgDiv.textContent = `[${displayName}]: ${message}`;
        }
    
        const displayName = from === myUsername ? 'You' : from || 'Anon';

        msgDiv.textContent = `[${displayName}]: ${message}`;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    socket.on('joinedGroup', (groupName) => {
        console.log("NEW GROUP BANYU");
        currentGroup = groupName.replace('group-', '');
        document.getElementById('chatTitle').textContent = 'Group: ' + currentGroup;
        document.getElementById('messages').innerHTML = ''; 
    });

    socket.on("groupLists", ({ joinedGroups, otherGroups }) => {
        renderGroupList(joinedListDiv, joinedGroups, true);
        renderGroupList(notJoinedListDiv, otherGroups, false);
    });

    function renderGroupList(container, groups, joined) {
        container.innerHTML = ""; 
        if (groups.length === 0) {
            const emptyMsg = document.createElement("div");
            emptyMsg.textContent = joined ? "You're not in any groups yet." : "No other groups available.";
            emptyMsg.style.fontSize = "14px";
            emptyMsg.style.color = "#777";
            container.appendChild(emptyMsg);
            return;
        }   

        groups.forEach(group => {
            const btn = document.createElement("button");
            btn.textContent = group;
            btn.className = "group-button";
            btn.style.marginBottom = "6px";
            btn.style.padding = "8px";
            btn.style.borderRadius = "5px";
            btn.style.border = "1px solid #ccc";
            btn.style.cursor = "pointer";
            btn.style.backgroundColor = joined ? "#e8f5e9" : "#e3f2fd";

            btn.onclick = () => {
                if (!joined) {
            
                const confirmJoin = document.createElement("button");
                confirmJoin.textContent = "Join";
                confirmJoin.style.marginLeft = "10px";
                confirmJoin.style.backgroundColor = "#4CAF50";
                confirmJoin.style.color = "#fff";
                confirmJoin.style.border = "none";
                confirmJoin.style.padding = "5px 10px";
                confirmJoin.style.borderRadius = "4px";
                confirmJoin.style.cursor = "pointer";

                if (!btn.querySelector("button")) {
                    btn.appendChild(confirmJoin);
                }

                confirmJoin.onclick = (e) => {
                    e.stopPropagation();
                    socket.emit("joinGroup", `group-${group}`);
                };
            }
            else {
                const leaveBtn = document.createElement("button");
                leaveBtn.textContent = "Leave";
                leaveBtn.style.marginLeft = "10px";
                leaveBtn.style.backgroundColor = "#f44336";
                leaveBtn.style.color = "#fff";
                leaveBtn.style.border = "none";
                leaveBtn.style.padding = "5px 10px";
                leaveBtn.style.borderRadius = "4px";
                leaveBtn.style.cursor = "pointer";


                if (!btn.querySelector("button")) {
                    btn.appendChild(leaveBtn);
                }

                leaveBtn.onclick = (e) => {
                    e.stopPropagation();
                    console.log("Leave Gropu Called here .....")
                    socket.emit("leaveGroup", `group-${group}`);
                };
    
                btn.addEventListener("dblclick", () => openChat(group));
            }
        };
            container.appendChild(btn);
        });
    }

    function openChat(group) {
        console.log("Opening chat for group:", group);
        currentGroup = group;
        document.getElementById('chatTitle').textContent = 'Group: ' + group;
        document.getElementById('messages').innerHTML = ''; 
        socket.emit("getGroupHistory", `group-${group}`);
    }
    socket.on("groupHistory", ({ group, history }) => {
        console.log("Group And History  : ",group ,history );
        if (group !== `group-${currentGroup}`) return;
        const messagesDiv = document.getElementById('messages');
        history.forEach(({ sender, message }) => {
            console.log("message History Mathi Msg Jouo ",sender,message)
            const msgDiv = document.createElement('div');
            msgDiv.textContent = `[${sender}]: ${message}`;
            messagesDiv.appendChild(msgDiv);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });
    function sendMessage() {
        const message = document.getElementById('msgInput').value.trim();
        if (message && currentGroup) {
            socket.emit('groupMessage', currentGroup, message);
            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.textContent = `[You]: ${message}`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            document.getElementById('msgInput').value = '';
        socket.emit('customEvent','custom Message Will Be called Here');

        }
    }
    document.getElementById('chatTitle').addEventListener('click', () => {
        if (currentGroup) {
            socket.emit('getGroupUsers', currentGroup);
        }
    });
    socket.on("groupUsers", ({ group, users }) => {
        const userList = document.getElementById("userList");
        userList.innerHTML = ""; 
        users.forEach(username => {
            const li = document.createElement("li");
            li.textContent = username;
            userList.appendChild(li);
        });
        document.getElementById("userPopup").style.display = "block";
    });
    function closeUserPopup() {
        document.getElementById("userPopup").style.display = "none";
    }

    socket.on('customEvent',(object)=>{
        console.log(object)
        // alert(message)
    })

    function sendBroadcastMessage(){
        socket.emit('sendBroadcastMessage');
    }

    // Listen for the "announcement" event
    socket.on("announcement", (data) => {
        console.log("📢 Announcement Received:", data);
        alert(data.text)

    });
</script>
</body>
</html>
